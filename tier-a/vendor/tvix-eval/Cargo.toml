[package]
name = "tvix-eval"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

# Vendored copy of the `eval/` crate from https://github.com/tvlfyi/tvix.git
# at rev 9fbca101331eecbf5c1cd44861f3d24aff101b82 (see
# docs/spikes/A2-snix.md and nixbox/README.md). Vendored, rather than used
# as a git dependency, so NixQuest can carry a small, targeted patch to a
# few `ErrorKind` variants that attaches the actual runtime `Value` to type
# and coercion errors (upstream discards it at the error-construction site),
# which is required for exact CppNix error-message parity. See
# nixbox/README.md "Patches to tvix-eval" for the full list of changes and
# nixbox/tier-a/vendor/UPSTREAM.patch for the diff against the pinned rev.
#
# `src/tests`, `tests/`, `benches/` and `proptest-regressions/` (upstream's
# own test suite and fixtures, ~3.5 MB of tiny .nix files) were deleted;
# they are `#[cfg(test)]`-gated in upstream and not needed to use the crate
# as a dependency.
#
# License: GPL-3.0 (from upstream `tvix`), acceptable per
# docs/ARCHITECTURE.md ("Internal audience only. GPL/LGPL runtimes are
# acceptable."). See LICENSE in this directory.

[lib]
name = "tvix_eval"

[dependencies]
builtin-macros = { path = "./builtin-macros", package = "tvix-eval-builtin-macros" }
bytes = "1.7.1"
bstr = { version = "1.10.0", features = ["serde"] }
codemap = "0.1.3"
codemap-diagnostic = "0.1.2"
dirs = "4.0.0"
genawaiter = { version = "0.99.1", default-features = false }
itertools = "0.12.1"
lexical-core = { version = "0.8.5", features = ["format", "parse-floats"] }
os_str_bytes = { version = "6.6", features = ["conversions"] }
path-clean = "0.1"
regex = "1.10.6"
rnix = "0.11.0"
rowan = "0.15" # pinned by rnix
serde = { version = "1.0.209", features = ["rc", "derive"] }
serde_json = "1.0"
smol_str = "0.2.2"
tabwriter = "1.4"
toml = "0.6.0"
sha2 = "0.10.8"
sha1 = "0.10.6"
md-5 = "0.10.6"
data-encoding = "2.6.0"
rustc-hash = "2.0.0"
nohash-hasher = "0.2.0"
thiserror = "2.0"
integer-encoding = "4.0.2"

[features]
default = ["impure"]

# Enables operations in the VM which depend on the ability to perform I/O
impure = []

# Don't leak strings (enable this if you care about peak memory usage of eval)
#
# This is intended as a stop-gap until we have a garbage collector
no_leak = []
