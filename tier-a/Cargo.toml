[package]
name = "nixbox-tier-a"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# snix-eval is an unpublished 0.0.0-pre placeholder on crates.io and its home
# (git.snix.dev) is blocked by our network policy. We use the same evaluator
# lineage from its public GitHub mirror instead: tvlfyi/tvix, crate
# `tvix-eval` (package `eval` in the workspace), pinned to rev
# 9fbca101331eecbf5c1cd44861f3d24aff101b82. This is upstream of the rename to
# "snix"; the language evaluator (compiler + VM + builtins) is the same code
# snix-eval descends from. See docs/spikes/A2-snix.md for the spike this
# productionizes, and nixbox/README.md for why it's now a vendored path
# dependency (vendor/tvix-eval) rather than a git dependency: a small patch
# to a few `ErrorKind` variants is needed for CppNix error-message parity,
# and `Compiler::new` needed a wasm32 fix so `add_src_builtin` (used for the
# well-known `derivation` function) doesn't call `std::env::current_dir()`
# (unavailable on wasm32) when compiling with no source location — see the
# "NixBox wasm32 patch" comment in vendor/tvix-eval/src/compiler/mod.rs.
tvix-eval = { path = "vendor/tvix-eval", default-features = false }
nix-compat = { path = "vendor/nix-compat", default-features = false }
codemap = "0.1.3"
rnix = "0.11.0"
rowan = "0.15"
bytes = "1"
bstr = "1.10.0"
data-encoding = "2.6.0"
genawaiter = { version = "0.99.1", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
